spring.application.name=ttracking

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/monitoramento_db}
spring.datasource.username=${DB_USERNAME:monitoramento_app}
spring.datasource.password=${DB_PASSWORD:ttracking000}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

